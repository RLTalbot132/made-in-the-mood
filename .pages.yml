media:
  input: media/uploads
  output: /media/uploads
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: pieces
    label: Pieces
    description: Every bracelet and necklace on the website. Add a piece, upload photos, set the price, then save. The website updates about a minute later.
    type: collection
    path: content/pieces
    format: json
    filename: "{primary}.json"
    view:
      fields: [name, type, price, status, show]
      primary: name
      sort: [name]
    fields:
      - name: name
        label: Name
        type: string
        required: true
        description: What customers ask for, like "Watermelon Sugar stack". It also becomes the piece's web address.
      - name: show
        label: Show on the website
        type: boolean
        default: true
        description: Turn off to hide a piece without deleting it.
      - name: photos
        label: Photos
        type: image
        options:
          multiple: true
        description: The first photo is the cover. Square photos look best; they are resized automatically.
      - name: type
        label: Type of piece
        type: select
        required: true
        default: necklace
        options:
          values:
            - value: necklace
              label: Necklace
            - value: bracelet
              label: Bracelet
            - value: set
              label: Bracelet set
            - value: wrap
              label: Convertible wrap
            - value: earrings
              label: Earrings
            - value: other
              label: Other
      - name: collection
        label: Collection
        type: select
        description: Optional. Leave blank if the piece isn't part of a collection.
        options:
          values:
            - value: candy-jade
              label: Candy Jade
            - value: aurum
              label: Aurum
            - value: aura
              label: Aura
      - name: price
        label: Price in dollars
        type: number
        options:
          min: 0
        description: Leave blank to show "Ask for price".
      - name: status
        label: Availability
        type: select
        required: true
        default: ready
        options:
          values:
            - value: ready
              label: Ready to ship
            - value: made
              label: Made to order
            - value: sold
              label: Sold out
      - name: sizes
        label: Sizes
        type: string
        description: For example "6.5 in, 7 in, or custom".
      - name: materials
        label: Materials
        type: string
        description: For example "Candy jade, rose quartz, 14k gold-fill".
      - name: description
        label: Description
        type: text
        description: Two or three sentences about how it looks and feels, and what it stacks with.
      - name: etsy
        label: Etsy listing link
        type: string
        description: Optional. Paste the piece's Etsy link to show a "Buy on Etsy" button next to "Email Ashley".
      - name: order
        label: Position on the shop page
        type: number
        description: Optional. Lower numbers show first (1, 2, 3...). Pieces without a number come after, in name order.

  - name: settings
    label: Shop details
    description: Contact details and the "about me" story shown on the website.
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: email
        label: Email for orders
        type: string
        description: Every "Email Ashley" button opens a message to this address.
      - name: venmo
        label: Venmo handle
        type: string
      - name: instagram
        label: Instagram handle
        type: string
      - name: tiktok
        label: TikTok handle
        type: string
      - name: etsy
        label: Etsy shop link
        type: string
        description: For example https://www.etsy.com/shop/MadeintheMoodJewelry
      - name: turnaround
        label: Typical turnaround
        type: string
        description: For example "5 to 7 days".
      - name: story
        label: Your story
        type: text
        description: Two or three sentences about how you started making jewelry. Shows under "Hi, I am Ashley."
