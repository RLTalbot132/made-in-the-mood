<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------
   Scale: the model is traced from the product photo (1254 px square).
   1 scene unit = 100 photo px ≈ 11.3 mm on the real 20-inch necklace.
   x = photo x, z = photo y, y = height above the table.
------------------------------------------------------------------- */
const DEG = Math.PI / 180, S = 0.01, CX = 650, CY = 600;

/* ---------------- renderer / scene ---------------- */
const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 400);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.8;

function fitCamera() {
  const a = innerWidth / innerHeight;
  const k = a >= 1.3 ? 1 : Math.pow(1.3 / a, 0.9);
  controls.target.set(0.3, 0.3, 0.55);
  camera.position.set(0, 10.8 * k, 13.2 * k).add(controls.target);
}
fitCamera();

/* soft light + soft shadows */
scene.add(new THREE.HemisphereLight(0xffffff, 0xefe5d8, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.55);
key.position.set(5, 15, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 1, far: 60 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);
const fill = new THREE.DirectionalLight(0xfff0de, 0.35);
fill.position.set(-9, 6, -5);
scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.ShadowMaterial({ opacity: 0.12 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------- small utilities ---------------- */
function rng(seed) {
  let a = (seed * 9301 + 49297) >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function makeNoise(seed, n = 6) {
  const r = rng(seed), terms = [];
  for (let i = 0; i < n; i++) {
    const d = new THREE.Vector3(r() * 2 - 1, r() * 2 - 1, r() * 2 - 1).normalize();
    terms.push({ d, k: 1.6 + r() * 3.4, ph: r() * 6.283, a: (0.5 + r()) / (1 + i * 0.35) });
  }
  const norm = terms.reduce((s, t) => s + t.a, 0);
  return v => terms.reduce((s, t) => s + t.a * Math.sin(t.d.dot(v) * t.k + t.ph), 0) / norm;
}
const tmpV = new THREE.Vector3();
function colorize(g, fn) {
  const p = g.attributes.position, c = new Float32Array(p.count * 3), col = new THREE.Color();
  for (let i = 0; i < p.count; i++) { tmpV.fromBufferAttribute(p, i); fn(tmpV, col); col.toArray(c, i * 3); }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  return g;
}
function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function mesh(g, m) { const o = new THREE.Mesh(g, m); o.castShadow = true; o.receiveShadow = true; return o; }
function shadowAll(o) { o.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } }); return o; }

/* faceted stone: subdivided icosahedron, vertices nudged so facets are irregular */
function gemGeo(detail, jit, seed, shape) {
  const g = new THREE.IcosahedronGeometry(1, detail);
  const r0 = rng(seed); g.rotateX(r0() * 6.28); g.rotateY(r0() * 6.28);
  const r = rng(seed * 13 + 7), map = new Map(), p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const k = `${v.x.toFixed(3)},${v.y.toFixed(3)},${v.z.toFixed(3)}`;
    let s = map.get(k); if (s === undefined) { s = 1 + (r() * 2 - 1) * jit; map.set(k, s); }
    v.multiplyScalar(s); if (shape) shape(v);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}
/* smooth lumpy sphere for baroque pearls */
function blobGeo(seed, amp, ws = 72, hs = 54) {
  let g = new THREE.SphereGeometry(1, ws, hs);
  g.deleteAttribute('normal'); g.deleteAttribute('uv'); g = mergeVertices(g);
  const n = makeNoise(seed, 7), p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i); const d = v.clone().normalize();
    v.multiplyScalar(1 + amp * n(d)); p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}
/* rondelle: lathe profile, hole axis turned to +X */
function rondelleGeo(faceted) {
  const pts = [], n = faceted ? 8 : 18;
  for (let i = 0; i <= n; i++) {
    const t = -Math.PI / 2 + Math.PI * i / n;
    const c = Math.cos(t), s = Math.sin(t);
    pts.push(new THREE.Vector2(Math.max(0.001, Math.pow(Math.abs(c), faceted ? 0.75 : 0.55)), Math.sign(s) * Math.pow(Math.abs(s), 1.25)));
  }
  const g = new THREE.LatheGeometry(pts, faceted ? 16 : 48);
  g.rotateZ(Math.PI / 2);
  return g;
}
/* fluted / corrugated gold bead, hole axis +X */
function corrugatedGeo() {
  let g = new THREE.SphereGeometry(1, 80, 40);
  g.deleteAttribute('normal'); g.deleteAttribute('uv'); g = mergeVertices(g);
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const phi = Math.atan2(v.z, v.x), ridge = 1 + 0.07 * Math.cos(18 * phi) * Math.sqrt(Math.max(0, 1 - v.y * v.y));
    v.x *= ridge; v.z *= ridge; v.y *= 0.88; p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals(); g.rotateZ(Math.PI / 2);
  return g;
}
function flowerShape(R, petals, depth, pw) {
  const s = new THREE.Shape(), N = 360;
  for (let i = 0; i <= N; i++) {
    const t = i / N * Math.PI * 2;
    const r = R * (1 - depth + depth * Math.pow(Math.abs(Math.cos(petals * t / 2)), pw));
    i ? s.lineTo(r * Math.cos(t), r * Math.sin(t)) : s.moveTo(r * Math.cos(t), r * Math.sin(t));
  }
  return s;
}
/* tube with a wobbling radius, for the organic gold clasp */
function organicTube(curve, segs, radial, rFn) {
  const fr = curve.computeFrenetFrames(segs, true), pos = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, c = curve.getPointAt(t), N = fr.normals[i], B = fr.binormals[i], r = rFn(t);
    for (let j = 0; j <= radial; j++) {
      const a = j / radial * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      pos.push(c.x + r * (ca * N.x + sa * B.x), c.y + r * (ca * N.y + sa * B.y), c.z + r * (ca * N.z + sa * B.z));
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) {
    const a = i * (radial + 1) + j, b = a + radial + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

/* ---------------- materials ---------------- */
const phys = o => new THREE.MeshPhysicalMaterial(o);
const C = h => new THREE.Color(h);
const M = {
  gold:     new THREE.MeshStandardMaterial({ color: 0xe9b84f, metalness: 1, roughness: 0.17, envMapIntensity: 1.25 }),
  agate:    phys({ color: 0xd2501c, roughness: 0.05, transmission: 0.32, thickness: 1.3, ior: 1.54, attenuationColor: C(0xa52f08), attenuationDistance: 0.7, clearcoat: 1, clearcoatRoughness: 0.04, flatShading: true }),
  amethyst: phys({ color: 0x7b3fb8, roughness: 0.04, transmission: 0.45, thickness: 1, ior: 1.54, attenuationColor: C(0x561c93), attenuationDistance: 0.5, clearcoat: 1, flatShading: true }),
  smoky:    phys({ color: 0x251a15, roughness: 0.03, transmission: 0.12, thickness: 1.5, ior: 1.54, attenuationColor: C(0x2a1a10), attenuationDistance: 0.3, clearcoat: 1, clearcoatRoughness: 0.02, flatShading: true }),
  smokyRd:  phys({ color: 0x4b3527, roughness: 0.04, transmission: 0.35, thickness: 0.8, ior: 1.54, attenuationColor: C(0x3b2416), attenuationDistance: 0.45, clearcoat: 1, flatShading: true }),
  clear:    phys({ color: 0xfffaf0, roughness: 0.0, transmission: 1, thickness: 0.9, ior: 1.6, attenuationColor: C(0xe2bf86), attenuationDistance: 0.9, clearcoat: 1, specularIntensity: 1, envMapIntensity: 1.6, flatShading: true }),
  citrine:  phys({ color: 0xf4c552, roughness: 0.03, transmission: 0.62, thickness: 1, ior: 1.54, attenuationColor: C(0xe29b20), attenuationDistance: 0.9, clearcoat: 1, flatShading: true }),
  carved:   phys({ color: 0xebb24c, roughness: 0.4, transmission: 0.08, thickness: 0.6, ior: 1.5, attenuationColor: C(0xdca23e), attenuationDistance: 0.8, sheen: 0.3, sheenColor: C(0xfff3d8) }),
  carvedLn: new THREE.MeshStandardMaterial({ color: 0xc28f35, roughness: 0.6 }),
  pearl:    phys({ color: 0xfaf1ec, envMapIntensity: 1.35, roughness: 0.12, iridescence: 0.75, iridescenceIOR: 1.35, iridescenceThicknessRange: [180, 520], sheen: 0.6, sheenColor: C(0xfff0f4), clearcoat: 0.8, clearcoatRoughness: 0.12 }),
  pink:     phys({ vertexColors: true, roughness: 0.16, clearcoat: 0.7, flatShading: true }),
  gray:     phys({ vertexColors: true, roughness: 0.26, iridescence: 0.5, iridescenceIOR: 1.6, clearcoat: 0.5 }),
  peridot:  phys({ vertexColors: true, roughness: 0.12, clearcoat: 0.9, clearcoatRoughness: 0.05, flatShading: true }),
  resin:    phys({ color: 0xffffff, roughness: 0.03, transparent: true, opacity: 0.16, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.6, depthWrite: false }),
  petal:    new THREE.MeshStandardMaterial({ color: 0xfdfdf9, roughness: 0.62, side: THREE.DoubleSide }),
  petalEdge:new THREE.MeshStandardMaterial({ color: 0xbdb5a0, roughness: 0.8, side: THREE.DoubleSide }),
};
const mix3 = (col, a, b, c, t1, t2) => col.copy(C(a)).lerp(C(b), THREE.MathUtils.clamp(t1, 0, 1)).lerp(C(c), THREE.MathUtils.clamp(t2, 0, 1));

/* ---------------- sections ---------------- */
const root = new THREE.Group();
scene.add(root);
const SECTIONS = [
  { key: 'agate',    name: 'Fire Agate',               color: '#c9501c', theta: 200, lift: 1.6 },
  { key: 'amethyst', name: 'Amethyst',                 color: '#6b2fa0', theta: 290, lift: 1.6 },
  { key: 'smoky',    name: 'Smoky & Clear Quartz',     color: '#3a2c25', theta: 15,  lift: 1.6 },
  { key: 'citrine',  name: 'Citrine & Yellow Jade', color: '#e9b949', theta: 335, lift: 0.5 },
  { key: 'pearl',    name: 'Pearls, Pink Lace & Labradorite', color: '#ead6d4', theta: 245, lift: 0.5 },
  { key: 'peridot',  name: 'Peridot',                  color: '#5b7a2a', theta: 155, lift: 0.5 },
  { key: 'glass',    name: 'Art Glass',                color: '#6f97b8', theta: 175, lift: 1.6 },
  { key: 'gold',     name: 'Gold Clasp & Charms',      color: '#d4a537', theta: 105, lift: 0.15 },
];
const G = {};
for (const s of SECTIONS) {
  s.group = new THREE.Group(); s.group.name = s.name; root.add(s.group); G[s.key] = s.group;
  s.dirH = new THREE.Vector3(Math.cos(s.theta * DEG), 0, Math.sin(s.theta * DEG));
  s.offset = s.dirH.clone().multiplyScalar(s.key === 'gold' ? 4.2 : 6.4).setY(s.lift);
}

/* place a part. Sizes in photo px: w = length along `ang`, h = across, vh = height */
const items = {};
function put(id, sec, obj, px, py, w, h, ang, vh, opt = {}) {
  const x = (px - CX) * S, z = (py - CY) * S;
  if (opt.scale !== false) obj.scale.set(w * S / 2, vh * S / 2, h * S / 2);
  obj.position.set(x, opt.y ?? vh * S / 2, z);
  obj.rotation.y = -ang * DEG;
  G[sec].add(obj);
  items[id] = { x, z, a: w * S / 2, b: h * S / 2, ang: ang * DEG, sec, gem: opt.gem !== false };
  return obj;
}

/* ===== 1 · Fire agate (orange faceted rounds) ===== */
put('fa1', 'agate', mesh(gemGeo(2, 0.012, 11), M.agate), 363, 175, 125, 125, 0, 125);
put('fa2', 'agate', mesh(gemGeo(2, 0.012, 12), M.agate), 318, 338, 135, 135, 0, 135);
put('fa3', 'agate', mesh(gemGeo(2, 0.012, 13), M.agate), 515, 740, 135, 135, 0, 135);

/* ===== 2 · Amethyst ===== */
put('am1', 'amethyst', mesh(gemGeo(2, 0.02, 21), M.amethyst), 545, 115, 75, 75, 0, 75);
put('am2', 'amethyst', mesh(gemGeo(2, 0.02, 22), M.amethyst), 730, 205, 95, 95, 0, 95);
put('am3', 'amethyst', mesh(gemGeo(2, 0.04, 23), M.amethyst), 985, 225, 100, 90, 35, 92);
put('am4', 'amethyst', mesh(gemGeo(1, 0.07, 24), M.amethyst), 150, 440, 105, 95, 80, 95);
put('am5', 'amethyst', mesh(gemGeo(1, 0.06, 25), M.amethyst), 710, 620, 105, 100, 20, 98);
put('am6', 'amethyst', mesh(gemGeo(1, 0.12, 26), M.amethyst), 915, 385, 125, 112, 60, 100);

/* ===== 3 · Smoky & clear quartz ===== */
put('sq1', 'smoky', mesh(gemGeo(1, 0.13, 31), M.smoky), 590, 485, 170, 128, -8, 105);
put('sq2', 'smoky', mesh(gemGeo(1, 0.13, 32), M.smoky), 950, 545, 170, 150, -35, 115);
put('sq3', 'smoky', mesh(gemGeo(2, 0.015, 33), M.smokyRd), 183, 362, 85, 85, 0, 85);
put('sq4', 'smoky', mesh(gemGeo(2, 0.015, 34), M.smokyRd), 290, 450, 85, 85, 0, 85);
put('cq1', 'smoky', mesh(rondelleGeo(true), M.clear), 830, 600, 72, 112, -17, 112);
put('cq2', 'smoky', mesh(rondelleGeo(true), M.clear), 650, 740, 72, 112, -8, 112);

/* ===== 4 · Citrine & carved yellow jade flowers ===== */
const taper = v => { const u = (v.x + 1) / 2, f = 1 - 0.5 * Math.pow(u, 1.4); v.y *= f; v.z *= f; };
const pinch = v => { const f = 1 - 0.22 * v.x * v.x; v.y *= f; v.z *= f; };
put('ct1', 'citrine', mesh(gemGeo(1, 0.05, 41, taper), M.citrine), 250, 655, 245, 112, 38, 90);
put('ct2', 'citrine', mesh(gemGeo(1, 0.08, 42, pinch), M.citrine), 550, 620, 180, 102, -4, 85);
function carvedFlower(R, seed) {
  const g = new THREE.Group();
  const geo = new THREE.ExtrudeGeometry(flowerShape(R - 0.06, 6, 0.2, 0.6), { depth: 0.2, bevelEnabled: true, bevelThickness: 0.12, bevelSize: 0.06, bevelSegments: 6, curveSegments: 4 });
  geo.rotateX(-Math.PI / 2);
  const body = mesh(geo, M.carved); body.position.y = 0.12; g.add(body);
  const top = 0.12 + 0.2 + 0.12;
  for (let k = 0; k < 6; k++) {               // carved petal grooves
    const a = (k + 0.5) / 6 * Math.PI * 2, len = R * 0.62;
    const b = mesh(new THREE.BoxGeometry(len, 0.012, 0.022), M.carvedLn);
    b.position.set(Math.cos(a) * (0.1 + len / 2), top - 0.002, -Math.sin(a) * (0.1 + len / 2));
    b.rotation.y = a; g.add(b);
  }
  const ctr = mesh(new THREE.SphereGeometry(1, 32, 16), M.carved);
  ctr.scale.set(0.13, 0.05, 0.13); ctr.position.y = top; g.add(ctr);
  g.rotation.y = seed;
  return g;
}
put('cf1', 'citrine', carvedFlower(0.5, 0.2), 620, 200, 100, 100, 10, 44, { scale: false, y: 0 });
put('cf2', 'citrine', carvedFlower(0.57, 0.9), 1040, 325, 115, 115, 20, 44, { scale: false, y: 0 });

/* ===== 5 · Pearls, pink crazy lace, labradorite rondelles ===== */
put('pl1', 'pearl', mesh(blobGeo(61, 0.13), M.pearl), 260, 270, 115, 85, -45, 72);
put('pl2', 'pearl', mesh(blobGeo(62, 0.14), M.pearl), 485, 220, 128, 95, 3, 78);
put('pl3', 'pearl', mesh(blobGeo(63, 0.15), M.pearl), 760, 520, 150, 95, -4, 78);
put('pl4', 'pearl', mesh(blobGeo(64, 0.13), M.pearl), 1030, 440, 125, 112, 85, 82);
function pinkGeo(seed) {
  const n = makeNoise(seed, 5);
  return colorize(gemGeo(3, 0.006, seed), (v, col) => {
    const t = Math.sin(v.y * 7 + v.x * 2 + 3.2 * n(v)) * 0.5 + 0.5;
    mix3(col, 0xd27f8a, 0xf2d3cc, 0xa8898c, t, Math.max(0, n(v.clone().multiplyScalar(2)) * 1.2));
  });
}

/* ---------- stringing order (traced bead-by-bead from the photo) ---------- */

function radAlong(it, dirAng) {
  const phi = dirAng - it.ang, a = it.a, b = it.b;
  return a * b / Math.sqrt((b * Math.cos(phi)) ** 2 + (a * Math.sin(phi)) ** 2);

  const B = items[ORDER[i + 1]];

  const dx = B.x - A.x, dz = B.z - A.z, d = Math.hypot(dx, dz), ang = Math.atan2(dz, dx);
  const ra = radAlong(A, ang), rb = radAlong(B, ang + Math.PI), gap = d - ra - rb;
  const t = ra + gap / 2;

  let best = null, bestD = -Infinity;
  s.group.children.forEach(ch => {
    if (ch === wire) return;
    const d = ch.position.x * s.dirH.x + ch.position.z * s.dirH.z;

  s.line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, tip]), lineMat());

}

/* ---------------- take-apart animation ---------------- */
function cubicBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (v < x) lo = t; else hi = t; t = (lo + hi) / 2; }
    return sy(t);
  };
}
const ease = cubicBezier(0.42, 0, 0.18, 1);   // gentle start, long slow settle
const DURATION = 3000;
let p = 0, from = 0, to = 0, t0 = 0, prevP = 0;
const btn = document.getElementById('toggle');
btn.addEventListener('click', () => {
  from = p; to = to === 1 ? 0 : 1; t0 = performance.now();
  btn.textContent = to ? 'Put it back together' : 'Take it apart';
});

/* camera eases up and back while the pieces spread, without fighting the user's own orbit/zoom */
const zoomF = q => 1 + q * (0.95 + Math.max(0, 1.3 - camera.aspect) * 0.9), liftF = q => 0.6 * q, tiltF = q => -0.12 * q;
const off = new THREE.Vector3(), sph = new THREE.Spherical();
function followExplode(q, qPrev) {
  const dy = liftF(q) - liftF(qPrev);
  camera.position.y += dy; controls.target.y += dy;
  off.subVectors(camera.position, controls.target).multiplyScalar(zoomF(q) / zoomF(qPrev));
  sph.setFromVector3(off);                                  // lower the viewing angle so the layers read side-on
  sph.phi = THREE.MathUtils.clamp(sph.phi + tiltF(q) - tiltF(qPrev), 0.05, controls.maxPolarAngle);
  off.setFromSpherical(sph);
  camera.position.copy(controls.target).add(off);
  ground.material.opacity = 0.12 - 0.06 * q;
}

/* ---------------- loop ---------------- */
const clock = new THREE.Clock();
const pv = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(clock.getDelta(), 0.05);
  root.rotation.y += dt * 0.12;                         // slow, constant turn

  if (p !== to) {
    const t = Math.min(1, (now - t0) / DURATION);
    p = from + (to - from) * ease(t);
    if (t >= 1) p = to;
  }
  if (p !== prevP) { followExplode(p, prevP); prevP = p; }
  for (const s of SECTIONS) s.group.position.copy(s.offset).multiplyScalar(p);

  controls.update();
  renderer.render(scene, camera);

  const q = THREE.MathUtils.smoothstep(p, 0.72, 1);
  const W = innerWidth, H = innerHeight;
  for (const s of SECTIONS) {
    s.line.material.opacity = q * 0.85;
    s.line.visible = q > 0.001;
    if (q < 0.001) { s.el.style.opacity = 0; continue; }
    pv.setFromMatrixPosition(s.tip.matrixWorld).project(camera);
    const behind = pv.z > 1;
    s.el.style.opacity = behind ? 0 : q;
    // keep every tag fully inside the frame (matters when embedded in a small square)
    const hw = (s.w ||= s.el.offsetWidth) / 2 + 6, hh = 14;
    const x = THREE.MathUtils.clamp((pv.x * 0.5 + 0.5) * W, hw, W - hw);
    const y = THREE.MathUtils.clamp((-pv.y * 0.5 + 0.5) * H, hh, H - hh);
    s.el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
