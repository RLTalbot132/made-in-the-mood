<script type="module">
/* Daisy Daydream Gemstone Convertible Wrap — interactive 3D model, generated for madeinthemoodjewelry.com.
   Every part is built from shapes in code; positions are traced from the product photo. */
const CFG = {
  S: 0.0115, CX: 545, CY: 790, metal: 'gold',
  sections: [
    { key: 'turq',    name: 'Turquoise Heishi',          color: '#3fb4c9' },
    { key: 'carn',    name: 'Carnelian',                 color: '#c0391b' },
    { key: 'blue',    name: 'Apatite',                   color: '#2a6fb5' },
    { key: 'aqua',    name: 'Aquamarine & Moonstone',    color: '#cfe3dc' },
    { key: 'goose',   name: 'Java Gooseberry Beads',     color: '#e0b13a' },
    { key: 'flowers', name: 'Mother-of-Pearl Flowers',   color: '#9fd8ec' },
    { key: 'gold',    name: 'Heart Clasp, Chain & Gold Beads', color: '#d4a537' },
  ],
  explode: { dist: 6.0 }, camTarget: [0, 0.3, 1.0],
};
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= shared viewer engine =================
   Photo coordinates (px) map to the table: x = photo x, z = photo y, y = up.
   CFG.S is scene units per photo pixel; CFG.CX / CFG.CY is the photo point placed at the origin. */
const DEG = Math.PI / 180;
const S = CFG.S, CX = CFG.CX, CY = CFG.CY;
const u = px => px * S;                                   // photo px -> scene units

/* ---------------- renderer / scene ---------------- */
const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = CFG.exposure ?? 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 400);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, minDistance: 4, maxDistance: 60, maxPolarAngle: Math.PI / 2 - 0.04, rotateSpeed: 0.7, zoomSpeed: 0.8 });
function fitCamera() {
  const a = innerWidth / innerHeight, k = (a >= 1.3 ? 1 : Math.pow(1.3 / a, 0.9)) * (CFG.camScale ?? 1);
  controls.target.set(...(CFG.camTarget ?? [0, 0.3, 0.4]));
  camera.position.set(0, 10.8 * k, 13.2 * k).add(controls.target);
}
fitCamera();

scene.add(new THREE.HemisphereLight(0xffffff, 0xefe5d8, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.55);
key.position.set(5, 15, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);
const fill = new THREE.DirectionalLight(0xfff0de, 0.35);
fill.position.set(-9, 6, -5);
scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.ShadowMaterial({ opacity: 0.12 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------- utilities ---------------- */
function rng(seed) {
  let a = (seed * 9301 + 49297) >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function makeNoise(seed, n = 6) {
  const r = rng(seed), terms = [];
  for (let i = 0; i < n; i++) {
    const d = new THREE.Vector3(r() * 2 - 1, r() * 2 - 1, r() * 2 - 1).normalize();
    terms.push({ d, k: 1.6 + r() * 3.4, ph: r() * 6.283, a: (0.5 + r()) / (1 + i * 0.35) });
  }
  const norm = terms.reduce((s, t) => s + t.a, 0);
  return v => terms.reduce((s, t) => s + t.a * Math.sin(t.d.dot(v) * t.k + t.ph), 0) / norm;
}
const C = h => new THREE.Color(h);
const phys = o => new THREE.MeshPhysicalMaterial(o);
const clamp01 = t => Math.min(1, Math.max(0, t));
const mix3 = (col, a, b, c, t1, t2) => col.copy(C(a)).lerp(C(b), clamp01(t1)).lerp(C(c), clamp01(t2));
const tmpV = new THREE.Vector3();
function colorize(g, fn) {
  const p = g.attributes.position, c = new Float32Array(p.count * 3), col = new THREE.Color();
  for (let i = 0; i < p.count; i++) { tmpV.fromBufferAttribute(p, i); fn(tmpV, col); col.toArray(c, i * 3); }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  return g;
}
/* mottled colour from three tones, driven by smooth noise */
function mottle(g, seed, a, b, c, freq = 2.4, fleck = 0) {
  const n = makeNoise(seed, 6);
  return colorize(g, (v, col) => {
    const t = n(v.clone().multiplyScalar(freq)) * 0.5 + 0.5;
    mix3(col, a, b, c, t, Math.max(0, n(v.clone().multiplyScalar(freq * 2.2)) - (0.3 - fleck)) * 1.6);
  });
}
function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function mesh(g, m) { const o = new THREE.Mesh(g, m); o.castShadow = true; o.receiveShadow = true; return o; }
function shadowAll(o) { o.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } }); return o; }
function group(...kids) { const g = new THREE.Group(); kids.forEach(k => k && g.add(k)); return g; }

/* faceted stone: subdivided icosahedron with nudged vertices so facets are irregular */
function gemGeo(detail, jit, seed, shape) {
  const g = new THREE.IcosahedronGeometry(1, detail);
  const r0 = rng(seed); g.rotateX(r0() * 6.28); g.rotateY(r0() * 6.28);
  const r = rng(seed * 13 + 7), map = new Map(), p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const k = `${v.x.toFixed(3)},${v.y.toFixed(3)},${v.z.toFixed(3)}`;
    let s = map.get(k); if (s === undefined) { s = 1 + (r() * 2 - 1) * jit; map.set(k, s); }
    v.multiplyScalar(s); if (shape) shape(v);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}
/* smooth lumpy sphere (baroque pearls, nuggets) */
function blobGeo(seed, amp, ws = 64, hs = 48) {
  let g = new THREE.SphereGeometry(1, ws, hs);
  g.deleteAttribute('normal'); g.deleteAttribute('uv'); g = mergeVertices(g);
  const n = makeNoise(seed, 7), p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i); const d = v.clone().normalize();
    v.multiplyScalar(1 + amp * n(d)); p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}
/* rondelle (lathe), hole axis along +X. faceted = few flat facets */
function rondelleGeo(faceted, radial, prof) {
  const pts = [], n = prof ?? (faceted ? 8 : 18);
  for (let i = 0; i <= n; i++) {
    const t = -Math.PI / 2 + Math.PI * i / n, c = Math.cos(t), s = Math.sin(t);
    pts.push(new THREE.Vector2(Math.max(0.001, Math.pow(Math.abs(c), faceted ? 0.75 : 0.55)), Math.sign(s) * Math.pow(Math.abs(s), 1.25)));
  }
  const g = new THREE.LatheGeometry(pts, radial ?? (faceted ? 16 : 48));
  g.rotateZ(Math.PI / 2);
  return g;
}
/* flat disc with rounded edge and centre hole (heishi, spacer discs), axis +X */
function discGeo(holeR = 0.32, radial = 28) {
  const pts = [], n = 10;
  pts.push(new THREE.Vector2(holeR, -1));
  for (let i = 0; i <= n; i++) {
    const t = -Math.PI / 2 + Math.PI * i / n;
    pts.push(new THREE.Vector2(0.78 + 0.22 * Math.cos(t), Math.sin(t)));
  }
  pts.push(new THREE.Vector2(holeR, 1));
  const g = new THREE.LatheGeometry(pts, radial);
  g.rotateZ(Math.PI / 2);
  return g;
}
/* fluted / corrugated metal bead, hole axis +X */
function corrugatedGeo(ridges = 18, depth = 0.07) {
  let g = new THREE.SphereGeometry(1, 72, 36);
  g.deleteAttribute('normal'); g.deleteAttribute('uv'); g = mergeVertices(g);
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const phi = Math.atan2(v.z, v.x), f = 1 + depth * Math.cos(ridges * phi) * Math.sqrt(Math.max(0, 1 - v.y * v.y));
    v.x *= f; v.z *= f; v.y *= 0.88; p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals(); g.rotateZ(Math.PI / 2);
  return g;
}
/* beaded/fluted gold rondelle spacer ring, axis +X */
function goldRondelleGeo() {
  const g = new THREE.TorusGeometry(0.62, 0.38, 20, 40);
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const a = Math.atan2(v.y, v.x), f = 1 + 0.06 * Math.cos(a * 16);
    v.x *= f; v.y *= f; p.setXYZ(i, v.x, v.y, v.z);
  }
  g.rotateY(Math.PI / 2); g.scale(1 / 0.38, 1, 1); g.computeVertexNormals();
  return g;
}
function flowerShape(R, petals, depth, pw, rot = 0) {
  const s = new THREE.Shape(), N = 360;
  for (let i = 0; i <= N; i++) {
    const t = i / N * Math.PI * 2;
    const r = R * (1 - depth + depth * Math.pow(Math.abs(Math.cos(petals * (t - rot) / 2)), pw));
    i ? s.lineTo(r * Math.cos(t), r * Math.sin(t)) : s.moveTo(r * Math.cos(t), r * Math.sin(t));
  }
  return s;
}
/* tube with a wobbling radius (organic clasps) */
function organicTube(curve, segs, radial, rFn, closed = true) {
  const fr = curve.computeFrenetFrames(segs, closed), pos = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, c = curve.getPointAt(t), N = fr.normals[i], B = fr.binormals[i], r = rFn(t);
    for (let j = 0; j <= radial; j++) {
      const a = j / radial * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      pos.push(c.x + r * (ca * N.x + sa * B.x), c.y + r * (ca * N.y + sa * B.y), c.z + r * (ca * N.z + sa * B.z));
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) {
    const a = i * (radial + 1) + j, b = a + radial + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
/* flat extruded shape lying on the table (shape drawn in px, +y = up in the photo) */
function slab(shape, depthPx, mat, bevelPx = 0, segs = 3) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: u(depthPx), bevelEnabled: bevelPx > 0, bevelThickness: u(bevelPx), bevelSize: u(bevelPx), bevelSegments: segs, curveSegments: 24 });
  g.rotateX(-Math.PI / 2);
  const m = mesh(g, mat); m.position.y = u(bevelPx);
  return m;
}
function smoothShapePx(pts) {                              // closed smooth outline through photo-px points
  const v = pts.map(([x, y]) => new THREE.Vector2(u(x), u(-y)));
  return new THREE.Shape(new THREE.SplineCurve([...v, v[0]]).getPoints(pts.length * 12));
}
function shapePx(pts) { const s = new THREE.Shape(); pts.forEach(([x, y], i) => i ? s.lineTo(u(x), u(-y)) : s.moveTo(u(x), u(-y))); return s; }

/* ---------------- shared materials ---------------- */
const METAL = {
  gold:   new THREE.MeshStandardMaterial({ color: 0xf0c25a, metalness: 1, roughness: 0.24, envMapIntensity: 1.45 }),
  silver: new THREE.MeshStandardMaterial({ color: 0xe8e8ea, metalness: 1, roughness: 0.14, envMapIntensity: 1.3 }),
};
/* flat polished metal mirrors the dark parts of the room, so flat charms use a satin finish */
METAL.goldFlat = new THREE.MeshStandardMaterial({ color: 0xf0c25a, metalness: 1, roughness: 0.34, envMapIntensity: 1.5 });
METAL.silverFlat = new THREE.MeshStandardMaterial({ color: 0xf0f0f2, metalness: 1, roughness: 0.3, envMapIntensity: 1.5 });
const M = { metal: METAL[CFG.metal ?? 'gold'], gold: METAL.gold, silver: METAL.silver, goldFlat: METAL.goldFlat, silverFlat: METAL.silverFlat };

/* ---------------- sections and parts ---------------- */
const root = new THREE.Group();
scene.add(root);
const SECTIONS = CFG.sections;
const G = {};
for (const s of SECTIONS) { s.group = new THREE.Group(); s.group.name = s.name; root.add(s.group); G[s.key] = s.group; }

/* put(id, section, object, x, y, w, h, angDeg, vh, opts)
   Sizes in photo px: w = length along angDeg (clockwise in the photo), h = across, vh = height.
   Unit-sized geometry is scaled to w/h/vh unless opts.scale === false. */
const items = {};
function put(id, sec, obj, px, py, w, h, ang, vh, opt = {}) {
  const x = u(px - CX), z = u(py - CY);
  if (opt.scale !== false) obj.scale.set(u(w) / 2, u(vh) / 2, u(h) / 2);
  obj.position.set(x, opt.y ?? (u(vh) / 2 + (opt.lift ?? 0)), z);
  obj.rotation.y = -ang * DEG;
  G[sec].add(obj);
  items[id] = { x, z, obj, sec, a: u(w) / 2, b: u(h) / 2, ang: ang * DEG };
  return obj;
}
/* turn axial beads (rondelles, discs, spacers) so their hole follows the strand */
function orientAlong(ids) {
  for (let i = 0; i < ids.length; i++) {
    const it = items[ids[i]], a = items[ids[Math.max(0, i - 1)]], b = items[ids[Math.min(ids.length - 1, i + 1)]];
    if (!it.obj.userData.axial) continue;
    const ang = Math.atan2(b.z - a.z, b.x - a.x);
    it.obj.rotation.y = -ang; it.ang = ang;
  }
}
/* thin wire through a list of parts (in order) */
function wire(ids, sec, mat = M.metal, r = 0.014, y = 0.12, closed = false) {
  const pts = ids.map(id => new THREE.Vector3(items[id].x, y, items[id].z));
  const w = mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, closed, 'centripetal'), Math.max(64, pts.length * 12), r, 6, closed), mat);
  w.userData.noLabel = true; G[sec].add(w); return w;
}

/* stringAlong: thread a sequence of beads along a traced path.
   pathPx: [[x,y],...] photo points; seq: [{id?, sec, make: () => Object3D, len (px along path), dia (px), vh?}]
   Beads touch end-to-end; `gap` px between them. Returns the ids placed. */
let autoId = 0;
function stringAlong(pathPx, seq, { gap = 0, start = 0, closed = false, lift = 0 } = {}) {
  const curve = new THREE.CatmullRomCurve3(pathPx.map(([x, y]) => new THREE.Vector3(u(x - CX), 0, u(y - CY))), closed, 'centripetal');
  const L = curve.getLength(), ids = [];
  let s = u(start);
  for (const b of seq) {
    const half = u(b.len) / 2; s += half;
    if (s > L * 1.002) break;
    const t = Math.min(1, s / L), p = curve.getPointAt(t), tan = curve.getTangentAt(t);
    const obj = b.make();
    const vh = b.vh ?? b.dia;
    if (b.scale !== false) obj.scale.set(u(b.len) / 2, u(vh) / 2, u(b.dia) / 2);
    const ang = Math.atan2(tan.z, tan.x);
    obj.position.set(p.x, b.y ?? (u(vh) / 2 + lift), p.z);
    obj.rotation.y = -ang + (b.spin ?? 0);
    const id = b.id ?? `auto${autoId++}`;
    G[b.sec].add(obj);
    items[id] = { x: p.x, z: p.z, obj, sec: b.sec, a: u(b.len) / 2, b: u(b.dia) / 2, ang };
    ids.push(id);
    s += half + u(b.gap ?? gap);
  }
  return { ids, used: s / S, length: L / S, curve };
}


/* evenly fill a traced run with identical beads (spec.len px each), e.g. heishi or carnelian runs */
function pathCurve(pathPx) {
  const curve = new THREE.CatmullRomCurve3(pathPx.map(([x, y]) => new THREE.Vector3(u(x - CX), 0, u(y - CY))), false, 'centripetal');
  return { curve, lengthPx: curve.getLength() / S };
}
function fillAlong(pathPx, spec, { gap = 0, lift = 0 } = {}) {
  const L = pathCurve(pathPx).lengthPx, n = Math.max(1, Math.floor((L + gap) / (spec.len + gap)));
  const g = (L - n * spec.len) / n;
  return stringAlong(pathPx, Array.from({ length: n }, () => ({ ...spec })), { gap: g, start: g / 2, lift }).ids;
}
/* fit an explicit mixed sequence into a traced run, spreading any slack evenly between beads */
function fitAlong(pathPx, seq, { lift = 0 } = {}) {
  const L = pathCurve(pathPx).lengthPx, sum = seq.reduce((s, b) => s + b.len, 0), g = Math.max(0, (L - sum) / seq.length);
  return stringAlong(pathPx, seq, { gap: g, start: g / 2, lift }).ids;
}
/* remove filler beads that sit under a feature bead placed at (px, py) */
function knockout(ids, px, py, rpx) {
  const x = u(px - CX), z = u(py - CY), r = u(rpx);
  return ids.filter(id => {
    const it = items[id];
    if (Math.hypot(it.x - x, it.z - z) < r) { it.obj.parent.remove(it.obj); delete items[id]; return false; }
    return true;
  });
}

/* ---------------- labels, take-apart, loop ---------------- */
function finish() {

  const n = SECTIONS.length;
  for (const s of SECTIONS) {
    const c = new THREE.Vector3(); let k = 0;
    s.group.children.forEach(ch => { if (!ch.userData.noLabel) { c.add(ch.position); k++; } });
    s.centroid = c.multiplyScalar(1 / Math.max(1, k));
    s.cAng = Math.atan2(s.centroid.z, s.centroid.x);
  }
  const ordered = [...SECTIONS].sort((a, b) => a.cAng - b.cAng);
  let best = 0, bestErr = Infinity;
  for (let b = 0; b < 360; b += 3) {
    let err = 0;
    ordered.forEach((s, i) => { const d = Math.abs(((b + i * 360 / n) * DEG - s.cAng + 3 * Math.PI) % (2 * Math.PI) - Math.PI); err += d * d; });
    if (err < bestErr) { bestErr = err; best = b; }

    const th = s.theta != null ? s.theta * DEG : (best + i * 360 / n) * DEG;
    s.dirH = new THREE.Vector3(Math.cos(th), 0, Math.sin(th));
    const dist = s.dist ?? E.dist ?? 6.4, lift = s.lift ?? (i % 2 ? (E.liftHi ?? 1.5) : (E.liftLo ?? 0.45));
    s.offset = s.dirH.clone().multiplyScalar(dist).setY(lift);
  });

  const labelLayer = document.getElementById('labels');
  for (const s of SECTIONS) {
    let bestCh = null, bestD = -Infinity;
    s.group.children.forEach(ch => {
      if (ch.userData.noLabel) return;
      const d = ch.position.x * s.dirH.x + ch.position.z * s.dirH.z;
      if (d > bestD) { bestD = d; bestCh = ch; }
    });
    const a = bestCh.position.clone();
    const tip = a.clone().addScaledVector(s.dirH, 1.5).add(new THREE.Vector3(0, 1.0, 0));
    s.line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, tip]),
      new THREE.LineBasicMaterial({ color: 0x8c8580, transparent: true, opacity: 0, depthTest: false }));
    s.line.renderOrder = 10; s.group.add(s.line);
    s.tip = new THREE.Object3D(); s.tip.position.copy(tip); s.group.add(s.tip);
    const el = document.createElement('div'); el.className = 'lbl';
    el.innerHTML = `<i style="background:${s.color}"></i>${s.name}`;
    labelLayer.appendChild(el); s.el = el;
  }

  const ease = cubicBezier(0.42, 0, 0.18, 1), DURATION = 3000;
  let p = 0, from = 0, to = 0, t0 = 0, prevP = 0;
  const btn = document.getElementById('toggle');
  btn.addEventListener('click', () => {
    from = p; to = to === 1 ? 0 : 1; t0 = performance.now();
    btn.textContent = to ? 'Put it back together' : 'Take it apart';
  });
  const zoomF = q => 1 + q * ((E.zoom ?? 0.95) + Math.max(0, 1.3 - camera.aspect) * 0.9), liftF = q => 0.6 * q, tiltF = q => -0.12 * q;
  const off = new THREE.Vector3(), sph = new THREE.Spherical();
  function followExplode(q, qPrev) {
    const dy = liftF(q) - liftF(qPrev);
    camera.position.y += dy; controls.target.y += dy;
    off.subVectors(camera.position, controls.target).multiplyScalar(zoomF(q) / zoomF(qPrev));
    sph.setFromVector3(off);
    sph.phi = THREE.MathUtils.clamp(sph.phi + tiltF(q) - tiltF(qPrev), 0.05, controls.maxPolarAngle);
    off.setFromSpherical(sph);

    const dt = Math.min(clock.getDelta(), 0.05);

    if (p !== prevP) { followExplode(p, prevP); prevP = p; }

      const hw = (s.w ||= s.el.offsetWidth) / 2 + 6;
      s.hh = (s.h ||= s.el.offsetHeight) / 2 + 2;
      s.sx = THREE.MathUtils.clamp((pv.x * 0.5 + 0.5) * W, hw, W - hw); s.sy = THREE.MathUtils.clamp((-pv.y * 0.5 + 0.5) * H, s.hh, H - s.hh); s.hw = hw;

      const A = shown[i], B = shown[j];
      if (Math.abs(A.sx - B.sx) < A.hw + B.hw - 12 && B.sy - A.sy < A.hh + B.hh) {

}
function cubicBezier(x1, y1, x2, y2) {

  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 30; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (v < x) lo = t; else hi = t; t = (lo + hi) / 2; }
    return sy(t);
