name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - id: pages
        uses: actions/configure-pages@v5
      - run: node scripts/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          sparse-checkout: indexnow-key.txt
          sparse-checkout-cone-mode: false
      - name: Tell search engines about changed pages (IndexNow)
        continue-on-error: true
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          KEY=$(tr -d '[:space:]' < indexnow-key.txt)
          HOST=$(echo "$SITE" | sed -E 's#https?://([^/]+).*#\1#')
          case "$HOST" in *.github.io) echo "Skipping IndexNow on github.io"; exit 0;; esac
          sleep 30
          URLS=$(curl -fsS "${SITE}sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY=$(python3 -c 'import json,sys;print(json.dumps({"host":sys.argv[1],"key":sys.argv[2],"keyLocation":"https://"+sys.argv[1]+"/"+sys.argv[2]+".txt","urlList":json.loads(sys.argv[3])}))' "$HOST" "$KEY" "$URLS")
          curl -sS -o /dev/null -w "IndexNow responded %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY"
